[options]
; Folders where Odoo looks for modules (besides its own built-in ones)
addons_path = /mnt/extra-addons,/mnt/oca-helpdesk

; Where attachments and other files are stored inside the container
data_dir = /var/lib/odoo

; Connection to the PostgreSQL container
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Only use this project's database. With a single database Odoo never has
; to ask "which database?", which also lets scripts generate PDF reports.
dbfilter = ^dulces_delicias$

; Master password, asked by the database manager page (/web/database/manager)
admin_passwd = admin

; Do not load Odoo's own demo data: we load our own case-study data instead
without_demo = all

; Outgoing emails go to Mailpit (http://localhost:8025), never to real inboxes
smtp_server = mailpit
smtp_port = 1025
email_from = notificaciones@dulcesdelicias.example
